# Hướng dẫn tạo Mật khẩu ứng dụng (App Password) cho Gmail:
# 1. Truy cập https://myaccount.google.com/security
# 2. Bật "Xác minh 2 bước" (2-Step Verification) nếu chưa bật
# 3. Tìm mục "Mật khẩu ứng dụng" (App passwords)
# 4. Đặt tên ứng dụng (VD: The Royal) và bấm Tạo
# 5. Copy mã 16 ký tự (VD: abcd efgh ijkl mnop) dán vào mail.password bên dưới
# ===================================================================

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# Email Gmail dùng để gửi đi (có thể dùng email cá nhân hoặc email hệ thống)
mail.username=ngocnbth07421@gmail.com

# Mật khẩu ứng dụng 16 ký tự của Gmail (App Password do Google cấp)
mail.password=

# Tên hiển thị người gửi
mail.from.name=THE ROYAL HOTEL MANAGEMENT
